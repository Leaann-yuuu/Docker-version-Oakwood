services:
  web:
    build:
      context: .
      args:
        DOC_ROOT: public
    container_name: app_web
    ports:
      - "8080:80"
    volumes:
      - ./src/server:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: app_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: app_pma
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 128M
    ports:
      - "8081:80"
    depends_on:
      - db

volumes:
  dbdata:
